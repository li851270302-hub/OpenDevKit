name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag
        required: true
        default: v0.4.0

permissions: {}

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v0.4.0."
            exit 1
          fi
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          test "$state" = "false"
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "opendevkit-$version-py3-none-any.whl" \
            --pattern "opendevkit-$version.tar.gz" \
            --pattern SHA256SUMS
      - name: Verify the exact release packages
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opendevkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pypi-packages
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
