name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: opendev security .
      - run: opendev deps . --json
      - run: opendev prompt-scan . --json

  distribution:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/opendevkit-wheel"
          "$RUNNER_TEMP/opendevkit-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/opendevkit-wheel/bin/python" -m pip check
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/opendevkit-wheel/bin/python" scripts/smoke_install.py "$expected_version"
      - name: Checksum release packages
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
